name: Build and publish ExtensionMesh theme

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-mesh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip, yaml, mbstring
          tools: composer:v2
          coverage: none
      - name: Install pinned Shopware CLI
        uses: FriendsOfShopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3
        with:
          version: '0.20.0'
      - name: Validate Composer metadata
        run: composer --no-plugins --no-scripts validate --no-check-lock --no-check-publish
      - name: Lint PHP source and release tools
        run: find src scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate store metadata, screenshots and icon
        run: php scripts/validate.php
      - name: Read release version
        id: version
        run: php -r 'echo "version=", json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR)["version"], PHP_EOL;' >> "$GITHUB_OUTPUT"
      - name: Build and inspect installable ZIP
        run: php scripts/build.php
      - name: Validate archive with Shopware CLI
        run: shopware-cli --no-interaction --no-update-hint --no-ai-hint extension validate ".build/EcomponentsStarterTheme-${{ steps.version.outputs.version }}.zip" --only=builtin,storefront-twig
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EcomponentsStarterTheme-${{ steps.version.outputs.version }}
          path: |
            .build/*.zip
            .build/SHA256SUMS
            .build/package.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EcomponentsStarterTheme-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/verified-theme
      - name: Verify artifact checksum
        working-directory: ${{ runner.temp }}/verified-theme
        run: sha256sum --check SHA256SUMS
      - name: Publish release and stable ExtensionMesh registry
        uses: Extension-Mesh/shopware-publisher@46d115ace839124ed9c5f762dd42bf849723eb5e # v1.0.0
        with:
          source-archive: ${{ runner.temp }}/verified-theme/EcomponentsStarterTheme-${{ needs.build.outputs.version }}.zip
        env:
          EXTENSION_MESH_TAG: v${{ needs.build.outputs.version }}
