# yaml-language-server: $schema=https://shopware.github.io/shopware-cli/shopware-extension-schema.json
compatibility_date: "2026-11-17"

build:
  zip:
    composer:
      enabled: false
    assets:
      # Source-only theme: SCSS is compiled by Shopware when assigning the theme.
      # Native Storefront JavaScript is inherited; there is no custom JS entry.
      enabled: false
    pack:
      excludes:
        paths:
          - .git
          - .github
          - .build
          - .gitignore
          - .gitattributes
          - .shopware-extension.yml
          - shopware-extension.yml
          - docs
          - scripts
          - dist

store:
  availabilities: [German, International]
  default_locale: de_DE
  localizations: [de_DE, en_GB]
  type: theme
  icon: src/Resources/config/plugin.png
  automatic_bugfix_version_compatibility: true
  meta_title:
    de: Ecomponents Starter – Kostenloses Theme
    en: Ecomponents Starter – Free Shopware Theme
  meta_description:
    de: Kostenloses Shopware-6.7-Theme unter MIT-Lizenz. Responsive Produktkarten, klare Navigation und anpassbare Farben, Schriften, Breiten und Eckenradien.
    en: Free MIT-licensed Shopware 6.7 theme with responsive product cards, clear navigation, configurable colours, fonts, content width and corner radius.
  description:
    de: |
      <h2>Ein klares Fundament für deinen Shopware-Shop</h2>
      <p>Ecomponents Starter ist ein kostenloses, eigenständiges Storefront-Theme für Shopware 6.7. Eine helle Oberfläche, gut lesbare Typografie, warme Akzente und dunkle Kaufbuttons sorgen für einen ruhigen Auftritt. Produktkarten, Navigation, Produktdetails, Formulare und Footer sind aufeinander abgestimmt.</p>
      <h3>Schlicht im Auftritt, flexibel in der Pflege</h3>
      <p>Farben, Schriftfamilien und Logos pflegst du über die normalen Shopware-Theme-Einstellungen. Zusätzlich lassen sich der Eckenradius und die maximale Inhaltsbreite einstellen. Das Theme schreibt keine Shopbezeichnung, kein Logo und keine feste Demo-Adresse in deine Storefront.</p>
      <ul><li>Responsive Produktkarten mit ausgerichtetem Preis- und Aktionsbereich</li><li>Klare Kategorie-Seitenleiste und native Produktfilter</li><li>Abgestimmte Produktdetails, Konto-, Warenkorb- und Checkout-Formulare</li><li>Native mobile Navigation und Shopware-Rechtsdialoge</li><li>Native CMS-Gestaltung für Hero, Themen-Teaser, Vorteile, Produkt-Slider und Editorial</li></ul>
      <h3>Shopware bleibt die Grundlage</h3>
      <p>Das Theme erweitert das Shopware-Standardtheme und übernimmt dessen Daten und Funktionen. Es benötigt weder EcomponentsTheme noch ExtensionMesh für den Betrieb. ExtensionMesh ist lediglich ein möglicher Installations- und Updateweg. Es gibt keine zusätzliche JavaScript-Datei, keine mitgelieferten externen Schriftquellen und keine eigenen Datenbankmigrationen.</p>
      <p>Produkte, Bilder, Navigation und Erlebniswelten stammen aus deinem Shop. Es werden keine Beispielprodukte oder CMS-Seiten angelegt. Die Screenshots zeigen eine lokale Theme-Vorschau mit vorhandenen Beispielinhalten; diese Inhalte sind nicht Bestandteil des Downloads.</p>
      <h3>Kostenlos unter MIT-Lizenz</h3>
      <p>Du darfst Ecomponents Starter entsprechend der beiliegenden MIT-Lizenz nutzen, verändern und weitergeben. Copyright- und Lizenzhinweise sind zu erhalten. Prüfe das Theme vor dem Einsatz mit den tatsächlichen Inhalten und Erweiterungen deines Shops. Shopware Core und Storefront müssen in Version 6.7 vorliegen.</p>
    en: |
      <h2>A clean foundation for your Shopware storefront</h2>
      <p>Ecomponents Starter is a free, standalone Storefront theme for Shopware 6.7. Its light surfaces, readable typography, warm accents and dark purchase buttons create a calm design. Navigation, product cards, product details, forms and the footer share a consistent appearance.</p>
      <h3>Simple design, flexible configuration</h3>
      <p>Use the native Shopware theme settings to configure colours, font families and logos. Additional settings control corner radius and maximum content width. No shop name, logo or fixed demo URL is embedded in your storefront.</p>
      <ul><li>Responsive product cards with aligned price and action areas</li><li>A clear category sidebar and native product filters</li><li>Coordinated product details, account, cart and checkout forms</li><li>Native mobile navigation and Shopware legal dialogs</li><li>Native CMS styling for hero sections, topic teasers, benefits, product sliders and editorial content</li></ul>
      <h3>Built on Shopware</h3>
      <p>The theme extends the default Shopware theme and retains its data and functionality. Neither EcomponentsTheme nor ExtensionMesh is required at runtime. ExtensionMesh is an optional installation and update channel. There is no additional JavaScript bundle, no bundled external font source and no custom database migration.</p>
      <p>Products, images, navigation and Shopping Experiences come from your shop. No demo products or CMS pages are created. Screenshots show a local theme preview with existing sample content; that content is not included in the download.</p>
      <h3>Free under the MIT license</h3>
      <p>Use, modify and redistribute Ecomponents Starter under the included MIT license, retaining its copyright and license notices. Validate the theme with the actual content and extensions of your shop before use. Shopware Core and Storefront 6.7 are required.</p>
  installation_manual:
    de: |
      <ol><li>Shopware Core und Storefront 6.7 sowie eine passende PHP-Version sicherstellen.</li><li>Die Repository-Adresse in ExtensionMesh als Quelle hinzufügen oder das geprüfte ZIP aus den GitHub-Releases unter Erweiterungen → Meine Erweiterungen hochladen.</li><li>Ecomponents Starter installieren und aktivieren.</li><li>Unter Inhalte → Themes ausschließlich dem gewünschten Storefront-Verkaufskanal zuweisen.</li><li>Logo, Farben, Schriften und die optionalen Layoutwerte einstellen und speichern. Shopware kompiliert die SCSS-Quellen für diesen Kanal.</li><li>Bestehende Erlebniswelten, Produktseiten, Filter, mobile Navigation und Checkout im Zielshop prüfen.</li></ol>
      <p>Es werden keine CMS-Seiten oder Beispielprodukte installiert. Vor der Umstellung die bisherige Theme-Zuweisung und Konfiguration sichern.</p>
    en: |
      <ol><li>Ensure Shopware Core and Storefront 6.7 and a compatible PHP version are installed.</li><li>Add the repository URL as an ExtensionMesh source, or upload the verified ZIP from GitHub Releases under Extensions → My extensions.</li><li>Install and activate Ecomponents Starter.</li><li>Under Content → Themes, assign it only to the intended Storefront sales channel.</li><li>Configure the logo, colours, fonts and optional layout settings and save. Shopware compiles the SCSS sources for that channel.</li><li>Check existing Shopping Experiences, product pages, filters, mobile navigation and checkout in the target shop.</li></ol>
      <p>No CMS pages or sample products are installed. Back up the current theme assignment and configuration before switching.</p>
  highlights:
    de:
      - Kostenlos und anpassbar unter MIT-Lizenz
      - Eigenständiges Theme auf Shopware-Standardbasis
      - Keine zusätzliche JavaScript-Datei oder externe Schriftquelle
    en:
      - Free and customisable under the MIT license
      - Standalone theme based on the default Shopware Storefront
      - No additional JavaScript bundle or external font source
  features:
    de:
      - Responsive Produktkarten und klare Navigation
      - Native Filter, Galerie und mobile Offcanvas-Menüs
      - Abstimmung von Produktdetails, Konto und Checkout
      - Farben, Logos und Schriftfamilien über Shopware pflegbar
      - Eckenradius von 0 bis 24 Pixeln
      - Maximale Inhaltsbreite von 960 bis 1680 Pixeln
      - Native CMS-Blöcke für Hero, Teaser-Galerie, Vorteile und Editorial
      - Keine eigenen Entitäten, Migrationen oder Beispieldaten
    en:
      - Responsive product cards and clear navigation
      - Native filters, gallery and mobile offcanvas menus
      - Coordinated product details, account and checkout
      - Native colour, logo and font-family settings
      - Corner radius from 0 to 24 pixels
      - Maximum content width from 960 to 1680 pixels
      - Native CMS blocks for hero, teaser gallery, benefits and editorial content
      - No custom entities, migrations or sample data
  tags:
    de: [Theme, Storefront, Responsiv, Kostenlos, MIT]
    en: [Theme, Storefront, Responsive, Free, MIT]
  faq:
    de:
      - question: Ist das Theme wirklich kostenlos?
        answer: Ja. Ecomponents Starter wird unter der MIT-Lizenz bereitgestellt. Copyright- und Lizenzhinweise sind bei der Weitergabe zu erhalten.
        position: 1
      - question: Benötige ich EcomponentsTheme oder ExtensionMesh?
        answer: Nein. Das Theme benötigt nur Shopware Core und Storefront 6.7. ExtensionMesh ist ein optionaler Installations- und Updateweg.
        position: 2
      - question: Werden Produkte oder Erlebniswelten installiert?
        answer: Nein. Inhalte stammen aus deinem Shop. Die Screenshot-Inhalte dienen nur der Vorschau und werden nicht importiert.
        position: 3
      - question: Wo ändere ich Farben, Logos und Eckenradius?
        answer: In der nativen Theme-Konfiguration unter Inhalte → Themes. Eckenradius und Inhaltsbreite stehen im Block Starter Layout.
        position: 4
    en:
      - question: Is the theme really free?
        answer: Yes. Ecomponents Starter is provided under the MIT license. Retain the copyright and license notices when redistributing it.
        position: 1
      - question: Do I need EcomponentsTheme or ExtensionMesh?
        answer: No. Only Shopware Core and Storefront 6.7 are required. ExtensionMesh is an optional installation and update channel.
        position: 2
      - question: Are products or Shopping Experiences installed?
        answer: No. Content comes from your shop. Screenshot content is for preview only and is not imported.
        position: 3
      - question: Where do I change colours, logos and corner radius?
        answer: Use the native theme configuration under Content → Themes. Corner radius and content width are in the Starter Layout block.
        position: 4
  image_directory: docs/screenshots
  images:
    - file: 05-home-desktop.png
      activate: {de: true, en: true}
      preview: {de: true, en: true}
      position: 1
      priority: 1
    - file: 06-home-mobile.png
      activate: {de: true, en: true}
      preview: {de: false, en: false}
      position: 2
      priority: 2
    - file: 01-catalog-desktop.png
      activate: {de: true, en: true}
      preview: {de: false, en: false}
      position: 3
      priority: 3
    - file: 02-product-desktop.png
      activate: {de: true, en: true}
      preview: {de: false, en: false}
      position: 4
      priority: 4
    - file: 03-product-mobile.png
      activate: {de: true, en: true}
      preview: {de: false, en: false}
      position: 5
      priority: 5
    - file: 04-account-desktop.png
      activate: {de: true, en: true}
      preview: {de: false, en: false}
      position: 6
      priority: 6
